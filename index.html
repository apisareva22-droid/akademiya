<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Академия АЛЬФАПРОМ — Вход</title>
    <style>
      :root{
        --navy:#2b2d33; --navy-2:#3f4149; --orange:#ff8100; --orange-dark:#cc6700;
        --gray-bg:#f4f5f7; --gray-line:#e2e5ea; --text:#232733; --text-light:#6b7280;
        --white:#ffffff; --radius:16px; --shadow:0 10px 30px rgba(43,45,51,0.08);
      }
      *{box-sizing:border-box;margin:0;padding:0;}
      body{
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
        background:linear-gradient(135deg,var(--navy) 0%, #17181c 100%);
        min-height:100vh; display:flex; align-items:center; justify-content:center;
        padding:24px;
      }
      .login-card{
        background:var(--white); border-radius:20px; padding:42px 38px;
        box-shadow:0 20px 50px rgba(0,0,0,0.3); width:100%; max-width:420px;
      }
      .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--navy);margin-bottom:26px;}
      .logo-badge{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--navy-2));display:flex;align-items:center;justify-content:center;color:var(--orange);font-weight:900;font-size:18px;}
      h3{font-size:22px;color:var(--navy);font-weight:800;margin-bottom:6px;}
      .sub{font-size:13.5px;color:var(--text-light);margin-bottom:26px;}
      .form-group{margin-bottom:18px;}
      .form-group label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;}
      .form-group input{
        width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--gray-line);
        font-size:14.5px;background:var(--gray-bg);transition:border-color .2s;
      }
      .form-group input:focus{outline:none;border-color:var(--orange);background:var(--white);}
      .btn-login{
        width:100%;background:var(--navy);color:#fff;padding:15px;border:none;border-radius:12px;
        font-weight:700;font-size:15px;cursor:pointer;transition:background .2s;
      }
      .btn-login:hover{background:var(--orange-dark);}
      .login-msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13.5px;display:none;}
      .login-msg.show{display:block;}
      .login-msg.success{background:rgba(46,160,67,0.1);color:#1e7a34;border:1px solid rgba(46,160,67,0.25);}
      .login-msg.error{background:rgba(230,60,60,0.08);color:#c0362c;border:1px solid rgba(230,60,60,0.2);}
      .hint{margin-top:18px;font-size:12px;color:var(--text-light);text-align:center;padding-top:16px;border-top:1px dashed var(--gray-line);}
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="logo"><div class="logo-badge">А</div>Академия АЛЬФАПРОМ</div>
      <h3>Вход в Академию</h3>
      <p class="sub">Используйте корпоративный email и пароль, выданные руководителем</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="login">Email</label>
          <input type="email" id="login" placeholder="i.ivanov@company.ru" required />
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-login">Войти в кабинет</button>
        <div id="loginMsg" class="login-msg"></div>
      </form>
      <div class="hint">Нет доступа? Обратитесь к администратору Академии.</div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD4BRDmQtttfw4xKSyhYT10Q3mXJmB9nkQ",
        authDomain: "akademiya-alfaprom.firebaseapp.com",
        projectId: "akademiya-alfaprom",
        storageBucket: "akademiya-alfaprom.firebasestorage.app",
        messagingSenderId: "172307954631",
        appId: "1:172307954631:web:331acad5cd8bc5bf37f7e2"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Если уже залогинен - сразу в кабинет
      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.href = 'dashboard.html';
        }
      });

      const loginForm = document.getElementById('loginForm');
      const loginMsg = document.getElementById('loginMsg');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login').value.trim();
        const password = document.getElementById('password').value.trim();
        loginMsg.classList.remove('show','success','error');

        try {
          await signInWithEmailAndPassword(auth, email, password);
          loginMsg.textContent = 'Успешный вход! Переходим в кабинет...';
          loginMsg.classList.add('show','success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
        } catch (err) {
          loginMsg.textContent = 'Неверный email или пароль. Проверьте данные или обратитесь к руководителю.';
          loginMsg.classList.add('show','error');
        }
      });
    </script>
  </body>
</html>
