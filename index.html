<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Академия АЛЬФАПРОМ — Вход</title>
    <style>

      :root{--orange:#ff8100;--bg:#f6f7f9;--card:#fff;--text:#20242a;--muted:#747b84;--line:#e6e8eb;--shadow:0 8px 28px rgba(24,31,39,.07);}
      *{box-sizing:border-box}
      body{
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
        background:var(--bg);
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
      }
      .login-card{
        background:var(--card);
        border:1px solid var(--line);
        border-radius:18px;
        padding:34px;
        box-shadow:var(--shadow);
        width:100%;
        max-width:440px;
      }
      .logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;color:var(--text);margin-bottom:28px;}
      .logo-badge{width:42px;height:42px;border-radius:12px;background:var(--orange);display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;}
      h3{font-size:28px;line-height:1.15;color:var(--text);font-weight:850;margin-bottom:7px;}
      .sub{font-size:13.5px;line-height:1.5;color:var(--muted);margin-bottom:26px;}
      .form-group{margin-bottom:18px;}
      .form-group label{display:block;font-size:12px;font-weight:750;color:var(--text);margin-bottom:7px;}
      .form-group input{width:100%;height:44px;padding:0 13px;border-radius:11px;border:1px solid var(--line);font-size:14px;background:#f7f8fa;transition:.18s ease;}
      .form-group input:focus{outline:none;border-color:#ffc080;background:#fff;box-shadow:0 0 0 4px rgba(255,129,0,.08);}
      .btn-login{width:100%;height:46px;background:var(--orange);color:#fff;padding:0 15px;border:none;border-radius:11px;font-weight:750;font-size:14px;cursor:pointer;transition:.18s ease;}
      .btn-login:hover{background:#e86f00;transform:translateY(-1px);}
      .login-msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13.5px;display:none;}
      .login-msg.show{display:block;}
      .login-msg.success{background:rgba(46,160,67,.1);color:#1e7a34;border:1px solid rgba(46,160,67,.25);}
      .login-msg.error{background:rgba(230,60,60,.08);color:#c0362c;border:1px solid rgba(230,60,60,.2);}
      .hint{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;padding-top:16px;border-top:1px solid var(--line);}
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="logo"><div class="logo-badge">А</div>Академия АЛЬФАПРОМ</div>
      <h3>Вход в Академию</h3>
      <p class="sub">Используйте корпоративный email и пароль, выданные руководителем</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="login">Email</label>
          <input type="email" id="login" placeholder="i.ivanov@company.ru" required />
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-login">Войти в кабинет</button>
        <div id="loginMsg" class="login-msg"></div>
      </form>
      <div class="hint">Нет доступа? Обратитесь к администратору Академии.</div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD4BRDmQtttfw4xKSyhYT10Q3mXJmB9nkQ",
        authDomain: "akademiya-alfaprom.firebaseapp.com",
        projectId: "akademiya-alfaprom",
        storageBucket: "akademiya-alfaprom.firebasestorage.app",
        messagingSenderId: "172307954631",
        appId: "1:172307954631:web:331acad5cd8bc5bf37f7e2"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Если уже залогинен - сразу в кабинет
      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.href = 'dashboard.html';
        }
      });

      const loginForm = document.getElementById('loginForm');
      const loginMsg = document.getElementById('loginMsg');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login').value.trim();
        const password = document.getElementById('password').value.trim();
        loginMsg.classList.remove('show','success','error');

        try {
          await signInWithEmailAndPassword(auth, email, password);
          loginMsg.textContent = 'Успешный вход! Переходим в кабинет...';
          loginMsg.classList.add('show','success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
        } catch (err) {
          loginMsg.textContent = 'Неверный email или пароль. Проверьте данные или обратитесь к руководителю.';
          loginMsg.classList.add('show','error');
        }
      });
    </script>
  </body>
</html>
