<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Академия АЛЬФАПРОМ — Личный кабинет</title>
    <style>
      :root{
        --navy:#2b2d33; --navy-2:#3f4149; --orange:#ff8100; --orange-dark:#cc6700;
        --gray-bg:#f4f5f7; --gray-line:#e2e5ea; --text:#232733; --text-light:#6b7280;
        --white:#ffffff; --radius:14px; --shadow:0 8px 24px rgba(43,45,51,0.08);
      }
      *{box-sizing:border-box;margin:0;padding:0;}
      body{
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
        background:var(--gray-bg); color:var(--text); display:flex; min-height:100vh;
      }
      /* Sidebar */
      .sidebar{
        width:280px; background:var(--navy); color:#fff; flex-shrink:0;
        display:flex; flex-direction:column; padding:24px 0;
        position:sticky; top:0; height:100vh; overflow-y:auto;
      }
      .sidebar-logo{
        display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px;
        padding:0 24px 24px; border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:16px;
      }
      .logo-badge{width:36px;height:36px;border-radius:9px;background:var(--orange);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex-shrink:0;}
      .nav-item{
        display:flex; align-items:center; gap:12px; padding:13px 24px; cursor:pointer;
        font-size:14.5px; font-weight:600; color:rgba(255,255,255,0.7); transition:all .15s;
        border-left:3px solid transparent;
      }
      .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
      .nav-item.active{background:rgba(255,129,0,0.12); color:var(--orange); border-left-color:var(--orange);}
      .nav-item .badge-progress{
        margin-left:auto; font-size:11px; font-weight:800; color:rgba(255,255,255,0.5);
      }
      .nav-item.active .badge-progress{color:var(--orange);}
      .nav-icon{font-size:17px; width:20px; text-align:center;}
      .nav-divider{height:1px; background:rgba(255,255,255,0.1); margin:12px 24px;}
      .nav-section-label{padding:6px 24px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,255,0.35); font-weight:700;}
      .logout-item{margin-top:auto; color:rgba(255,120,120,0.85);}
      .logout-item:hover{background:rgba(255,80,80,0.1); color:#ff8a8a;}

      /* Main */
      .main{flex:1; padding:36px 44px; max-width:1100px;}
      .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;}
      .topbar h1{font-size:26px; font-weight:800; color:var(--navy);}
      .user-chip{display:flex; align-items:center; gap:10px; background:var(--white); padding:8px 16px 8px 8px; border-radius:999px; box-shadow:var(--shadow);}
      .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
      .user-chip span{font-size:13.5px;font-weight:600;color:var(--navy);}

      .view{display:none;}
      .view.active{display:block;}

      /* Личный кабинет overview */
      .overview-card{
        background:var(--white); border-radius:var(--radius); padding:30px; box-shadow:var(--shadow); margin-bottom:24px;
      }
      .overview-top{display:flex; align-items:center; gap:20px; margin-bottom:22px;}
      .overview-avatar{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;flex-shrink:0;}
      .overview-name{font-size:20px;font-weight:800;color:var(--navy);}
      .overview-role{font-size:13px;color:var(--text-light);}
      .overall-progress-wrap{margin-top:8px;}
      .overall-progress-label{display:flex;justify-content:space-between;font-size:13px;color:var(--text-light);margin-bottom:6px;}
      .overall-progress-bar{height:12px;background:var(--gray-line);border-radius:10px;overflow:hidden;}
      .overall-progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-dark));border-radius:10px;transition:width .4s;}

      .modules-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px;}
      .module-card{background:var(--white); border:1px solid var(--gray-line); border-radius:var(--radius); padding:20px; cursor:pointer; transition:transform .15s, box-shadow .15s;}
      .module-card:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
      .module-card h4{font-size:15px; color:var(--navy); font-weight:700; margin-bottom:10px;}
      .progress-line{height:8px;background:var(--gray-line);border-radius:8px;overflow:hidden;margin-bottom:8px;}
      .progress-line i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--orange),var(--orange-dark));}
      .module-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-light);}
      .stars{color:var(--orange); letter-spacing:2px;}

      /* Module view */
      .module-view h2{font-size:24px; color:var(--navy); font-weight:800; margin-bottom:6px;}
      .module-sub{color:var(--text-light); font-size:14px; margin-bottom:26px;}
      .stage-card{background:var(--white); border-radius:var(--radius); padding:26px; box-shadow:var(--shadow); margin-bottom:20px; position:relative;}
      .stage-card.locked{opacity:0.5; pointer-events:none;}
      .stage-tag{display:inline-block; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--orange-dark); background:rgba(255,129,0,0.1); padding:4px 10px; border-radius:6px; margin-bottom:12px;}
      .stage-card h3{font-size:17px; color:var(--navy); font-weight:700; margin-bottom:10px;}
      .stage-card p{font-size:14px; color:var(--text); margin-bottom:14px; line-height:1.7;}
      .video-wrap{position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:12px; margin-bottom:16px; background:#000;}
      .video-wrap iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
      .btn{display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:10px; font-weight:700; font-size:14px; border:none; cursor:pointer; transition:all .2s;}
      .btn-primary{background:var(--orange); color:#fff;}
      .btn-primary:hover{background:var(--orange-dark);}
      .btn-primary:disabled{background:#d8d8d8; cursor:not-allowed;}
      .done-badge{display:inline-flex; align-items:center; gap:6px; color:#1e7a34; font-weight:700; font-size:13.5px; background:rgba(46,160,67,0.1); padding:8px 14px; border-radius:8px;}

      .question{margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid var(--gray-line);}
      .question:last-of-type{border-bottom:none;}
      .question p{font-weight:600; color:var(--navy); margin-bottom:10px;}
      .option{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; margin-bottom:6px; cursor:pointer; font-size:13.5px; transition:background .15s;}
      .option:hover{background:var(--gray-bg);}
      .option input{cursor:pointer;}
      .test-result{margin-top:16px; padding:14px; border-radius:10px; font-size:14px; font-weight:600; display:none;}
      .test-result.show{display:block;}
      .test-result.pass{background:rgba(46,160,67,0.1); color:#1e7a34;}
      .test-result.fail{background:rgba(230,60,60,0.08); color:#c0362c;}
      .locked-note{color:var(--text-light); font-size:13.5px; font-style:italic;}

      @media(max-width:860px){
        body{flex-direction:column;}
        .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; padding:14px;}
        .sidebar-logo{display:none;}
        .nav-item{white-space:nowrap; border-left:none; border-bottom:3px solid transparent;}
        .nav-item.active{border-left:none; border-bottom-color:var(--orange);}
        .logout-item{margin-top:0;}
        .main{padding:24px;}
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-badge">А</div>Академия АЛЬФАПРОМ</div>

      <div class="nav-item active" data-view="overview">
        <span class="nav-icon">👤</span> Личный кабинет
      </div>

      <div class="nav-divider"></div>
      <div class="nav-section-label">Обучение по оборудованию</div>

      <div class="nav-item" data-view="module" data-module="vakuum">
        <span class="nav-icon">🧊</span> Вакуумный упаковщик
        <span class="badge-progress" id="navProgress-vakuum">0%</span>
      </div>
      <div class="nav-item" data-view="module" data-module="zapaika">
        <span class="nav-icon">📦</span> Запайщик лотков
        <span class="badge-progress" id="navProgress-zapaika">0%</span>
      </div>
      <div class="nav-item" data-view="module" data-module="pelmeni">
        <span class="nav-icon">🥟</span> Пельменные аппараты
        <span class="badge-progress" id="navProgress-pelmeni">0%</span>
      </div>

      <div class="nav-divider"></div>
      <div class="nav-item logout-item" id="logoutBtn">
        <span class="nav-icon">🚪</span> Выйти
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1 id="topbarTitle">Личный кабинет</h1>
        <div class="user-chip">
          <div class="user-avatar" id="userAvatar">—</div>
          <span id="userChipName">Загрузка...</span>
        </div>
      </div>

      <!-- OVERVIEW VIEW -->
      <section class="view active" id="view-overview">
        <div class="overview-card">
          <div class="overview-top">
            <div class="overview-avatar" id="overviewAvatar">—</div>
            <div>
              <div class="overview-name" id="overviewName">Загрузка...</div>
              <div class="overview-role" id="overviewRole">—</div>
            </div>
          </div>
          <div class="overall-progress-wrap">
            <div class="overall-progress-label"><span>Общий прогресс обучения</span><span id="overallProgressPct">0%</span></div>
            <div class="overall-progress-bar"><i id="overallProgressBar" style="width:0%"></i></div>
          </div>
        </div>

        <div class="modules-grid" id="overviewModulesGrid"></div>
      </section>

      <!-- MODULE VIEW (template, filled by JS) -->
      <section class="view module-view" id="view-module">
        <h2 id="moduleTitle">—</h2>
        <p class="module-sub" id="moduleSub">—</p>
        <div id="moduleStages"></div>
      </section>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD4BRDmQtttfw4xKSyhYT10Q3mXJmB9nkQ",
        authDomain: "akademiya-alfaprom.firebaseapp.com",
        projectId: "akademiya-alfaprom",
        storageBucket: "akademiya-alfaprom.firebasestorage.app",
        messagingSenderId: "172307954631",
        appId: "1:172307954631:web:331acad5cd8bc5bf37f7e2"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // ===================== КОНФИГУРАЦИЯ МОДУЛЕЙ =====================
      // Здесь редактируется контент обучения. Позже сюда добавляются новые виды оборудования.
      const MODULES = {
        vakuum: {
          title: "Вакуумный упаковщик",
          icon: "🧊",
          stages: [
            {
              type: "theory",
              tag: "Шаг 1 · Теория",
              heading: "Что такое вакуумный упаковщик",
              text: "Вакуумный упаковщик — устройство, удаляющее воздух из упаковки с продуктом и герметично запаивающее её. Это увеличивает срок годности, сохраняет свежесть и предотвращает развитие бактерий. Основные типы: бытовые (ручные), полупрофессиональные, профессиональные (камерные), бескамерные (аспирационные), проточные (автоматические).",
              videoId: "dQw4w9WgXcQ"
            },
            {
              type: "test",
              tag: "Шаг 2 · Тест",
              heading: "Проверьте знания",
              passScore: 80,
              questions: [
                {
                  q: "Для чего нужен вакуумный упаковщик?",
                  options: ["Для нарезки продукта", "Для удаления воздуха и герметичной запайки упаковки", "Для заморозки продукта", "Для маркировки товара"],
                  correct: 1
                },
                {
                  q: "Какой тип вакуумного упаковщика подходит для промышленного использования с наивысшим уровнем вакуума?",
                  options: ["Бытовой (ручной)", "Бескамерный", "Профессиональный (камерный)", "Проточный (автоматический)"],
                  correct: 2
                },
                {
                  q: "Что делает 'красный' вакуумный насос особенным?",
                  options: ["Работает без электричества", "Используется при газонаполнении с высокой концентрацией кислорода", "Быстрее откачивает воздух в 2 раза", "Не требует обслуживания"],
                  correct: 1
                },
                {
                  q: "Какой вопрос ОБЯЗАТЕЛЬНО нужно задать клиенту при подборе оборудования?",
                  options: ["Любимый цвет упаковки", "Какой продукт будет упаковываться и в каком виде", "Название компании", "Количество сотрудников"],
                  correct: 1
                },
                {
                  q: "Какое напряжение сети важно уточнить у клиента?",
                  options: ["Только 220В", "Только 380В", "220В или 380В — уточнять обязательно", "Напряжение не имеет значения"],
                  correct: 2
                }
              ]
            }
          ]
        },
        zapaika: {
          title: "Запайщик лотков",
          icon: "📦",
          stages: [
            {
              type: "theory",
              tag: "Шаг 1 · Теория",
              heading: "Что такое запайщик лотков",
              text: "Запайщик лотков — оборудование для герметичной запайки пластиковых или алюминиевых лотков с продукцией плёнкой. Используется в общепите, ритейле, производстве готовой еды. Бывают ручные, полуавтоматические и автоматические (линейные) модели.",
              videoId: "dQw4w9WgXcQ"
            },
            {
              type: "test",
              tag: "Шаг 2 · Тест",
              heading: "Проверьте знания",
              passScore: 80,
              questions: [
                {
                  q: "Основная функция запайщика лотков?",
                  options: ["Мойка лотков", "Герметичная запайка лотков плёнкой", "Печать этикеток", "Взвешивание продукта"],
                  correct: 1
                },
                {
                  q: "Где чаще всего применяется запайщик лотков?",
                  options: ["В строительстве", "В общепите и производстве готовой еды", "В автомобилестроении", "В текстильной промышленности"],
                  correct: 1
                },
                {
                  q: "Какой формат оборудования подходит для высокой производительности на линии?",
                  options: ["Ручной", "Полуавтоматический", "Автоматический (линейный)", "Все одинаковы"],
                  correct: 2
                },
                {
                  q: "Что важно уточнить у клиента про лотки?",
                  options: ["Материал и размер лотка", "Цвет упаковки", "Название продукта на этикетке", "Логотип компании"],
                  correct: 0
                },
                {
                  q: "Может ли запайщик работать с газонаполнением (MAP)?",
                  options: ["Никогда", "Да, есть модели с функцией газонаполнения", "Только с жидкостями", "Только с металлом"],
                  correct: 1
                }
              ]
            }
          ]
        },
        pelmeni: {
          title: "Пельменные аппараты",
          icon: "🥟",
          stages: [
            {
              type: "theory",
              tag: "Шаг 1 · Теория",
              heading: "Что такое пельменный аппарат",
              text: "Пельменный аппарат автоматизирует процесс лепки пельменей, вареников и других изделий из теста с начинкой. Существуют настольные модели для малого бизнеса и промышленные линии с высокой производительностью (тысячи изделий в час).",
              videoId: "dQw4w9WgXcQ"
            },
            {
              type: "test",
              tag: "Шаг 2 · Тест",
              heading: "Проверьте знания",
              passScore: 80,
              questions: [
                {
                  q: "Что делает пельменный аппарат?",
                  options: ["Варит пельмени", "Автоматизирует лепку изделий из теста с начинкой", "Замораживает готовую продукцию", "Упаковывает готовые пельмени"],
                  correct: 1
                },
                {
                  q: "Для какого бизнеса подходят настольные модели?",
                  options: ["Только для крупных заводов", "Для малого бизнеса и небольших цехов", "Только для ресторанов", "Не существуют"],
                  correct: 1
                },
                {
                  q: "Что нужно уточнить у клиента в первую очередь?",
                  options: ["Требуемая производительность в час", "Любимый вкус начинки", "Цвет корпуса аппарата", "День недели поставки"],
                  correct: 0
                },
                {
                  q: "Промышленные линии пельменных аппаратов способны производить...",
                  options: ["До 10 штук в час", "До 100 штук в час", "Тысячи изделий в час", "Только вручную"],
                  correct: 2
                },
                {
                  q: "Что важно для длительной эксплуатации аппарата?",
                  options: ["Регулярное техобслуживание", "Использование только летом", "Отключение раз в год", "Ничего не важно"],
                  correct: 0
                }
              ]
            }
          ]
        }
      };
      // ===================================================================

      let currentUser = null;
      let userData = null;

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = 'index.html';
          return;
        }
        currentUser = user;
        await loadUserData();
        renderOverview();
        setupNav();
      });

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = 'index.html';
      });

      async function loadUserData() {
        const ref = doc(db, 'users', currentUser.email);
        const snap = await getDoc(ref);
        if (snap.exists()) {
          userData = snap.data();
        } else {
          userData = { name: currentUser.email, role: 'Сотрудник' };
        }
        if (!userData.progress) userData.progress = {};

        const initials = (userData.name || currentUser.email).split(' ').map(s => s[0]).join('').slice(0,2).toUpperCase();
        document.getElementById('userAvatar').textContent = initials;
        document.getElementById('overviewAvatar').textContent = initials;
        document.getElementById('userChipName').textContent = userData.name || currentUser.email;
        document.getElementById('overviewName').textContent = userData.name || currentUser.email;
        document.getElementById('overviewRole').textContent = userData.role || 'Сотрудник';
      }

      function getModuleProgress(moduleKey) {
        const mod = MODULES[moduleKey];
        const prog = (userData.progress && userData.progress[moduleKey]) || {};
        const totalStages = mod.stages.length;
        let passedStages = 0;
        mod.stages.forEach((stage, i) => {
          const stageState = prog['stage' + i];
          if (stage.type === 'theory' && stageState && stageState.viewed) passedStages++;
          if (stage.type === 'test' && stageState && stageState.passed) passedStages++;
        });
        return Math.round((passedStages / totalStages) * 100);
      }

      function starsForPercent(pct) {
        if (pct >= 91) return 5;
        if (pct >= 71) return 4;
        if (pct >= 46) return 3;
        if (pct >= 21) return 2;
        if (pct > 0) return 1;
        return 0;
      }

      function renderOverview() {
        const keys = Object.keys(MODULES);
        let totalPct = 0;
        const grid = document.getElementById('overviewModulesGrid');
        grid.innerHTML = '';

        keys.forEach((key) => {
          const pct = getModuleProgress(key);
          totalPct += pct;
          const stars = starsForPercent(pct);
          document.getElementById('navProgress-' + key).textContent = pct + '%';

          const card = document.createElement('div');
          card.className = 'module-card';
          card.innerHTML = `
            <h4>${MODULES[key].icon} ${MODULES[key].title}</h4>
            <div class="progress-line"><i style="width:${pct}%"></i></div>
            <div class="module-foot">
              <span>Прогресс ${pct}%</span>
              <span class="stars">${stars > 0 ? '⭐'.repeat(stars) : '—'}</span>
            </div>
          `;
          card.addEventListener('click', () => openModule(key));
          grid.appendChild(card);
        });

        const overallPct = Math.round(totalPct / keys.length);
        document.getElementById('overallProgressPct').textContent = overallPct + '%';
        document.getElementById('overallProgressBar').style.width = overallPct + '%';
      }

      function setupNav() {
        document.querySelectorAll('.nav-item[data-view]').forEach((item) => {
          item.addEventListener('click', () => {
            const view = item.dataset.view;
            if (view === 'overview') {
              switchView('overview');
              document.getElementById('topbarTitle').textContent = 'Личный кабинет';
            } else if (view === 'module') {
              openModule(item.dataset.module);
            }
            document.querySelectorAll('.nav-item[data-view]').forEach(n => n.classList.remove('active'));
            item.classList.add('active');
          });
        });
      }

      function switchView(name) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + name).classList.add('active');
      }

      function openModule(key) {
        const mod = MODULES[key];
        document.getElementById('topbarTitle').textContent = mod.title;
        document.getElementById('moduleTitle').textContent = mod.icon + ' ' + mod.title;
        document.getElementById('moduleSub').textContent = 'Изучите теорию и пройдите тест минимум на 80%, чтобы открыть следующий раздел';
        switchView('module');

        document.querySelectorAll('.nav-item[data-view]').forEach(n => n.classList.remove('active'));
        const navItem = document.querySelector(`.nav-item[data-module="${key}"]`);
        if (navItem) navItem.classList.add('active');

        renderModuleStages(key);
      }

      function renderModuleStages(key) {
        const mod = MODULES[key];
        const container = document.getElementById('moduleStages');
        container.innerHTML = '';

        if (!userData.progress[key]) userData.progress[key] = {};

        let previousPassed = true;

        mod.stages.forEach((stage, i) => {
          const stageState = userData.progress[key]['stage' + i] || {};
          const isLocked = !previousPassed;
          const card = document.createElement('div');
          card.className = 'stage-card' + (isLocked ? ' locked' : '');

          if (stage.type === 'theory') {
            const viewed = stageState.viewed;
            card.innerHTML = `
              <span class="stage-tag">${stage.tag}</span>
              <h3>${stage.heading}</h3>
              <div class="video-wrap"><iframe src="https://www.youtube.com/embed/${stage.videoId}" allowfullscreen></iframe></div>
              <p>${stage.text}</p>
              ${isLocked ? '<p class="locked-note">🔒 Сначала пройдите предыдущий шаг</p>' :
                (viewed ? '<span class="done-badge">✓ Теория изучена</span>' :
                `<button class="btn btn-primary" id="theoryBtn-${key}-${i}">Я изучил(а) теорию</button>`)}
            `;
            container.appendChild(card);

            if (!isLocked && !viewed) {
              document.getElementById(`theoryBtn-${key}-${i}`).addEventListener('click', async () => {
                userData.progress[key]['stage' + i] = { viewed: true };
                await saveProgress();
                renderModuleStages(key);
                renderOverview();
              });
            }
            previousPassed = viewed || isLocked ? previousPassed && viewed : false;
            previousPassed = viewed;
          }

          if (stage.type === 'test') {
            const passed = stageState.passed;
            const bestScore = stageState.score || 0;

            let questionsHtml = '';
            stage.questions.forEach((q, qi) => {
              let optsHtml = '';
              q.options.forEach((opt, oi) => {
                optsHtml += `
                  <label class="option">
                    <input type="radio" name="q-${key}-${i}-${qi}" value="${oi}" />
                    ${opt}
                  </label>`;
              });
              questionsHtml += `<div class="question"><p>${qi+1}. ${q.q}</p>${optsHtml}</div>`;
            });

            card.innerHTML = `
              <span class="stage-tag">${stage.tag}</span>
              <h3>${stage.heading}</h3>
              ${isLocked ? '<p class="locked-note">🔒 Сначала изучите теорию выше</p>' : `
                <form id="testForm-${key}-${i}">
                  ${questionsHtml}
                  <button type="submit" class="btn btn-primary">Проверить ответы</button>
                </form>
                <div class="test-result" id="testResult-${key}-${i}"></div>
                ${passed ? `<div style="margin-top:12px;" class="done-badge">✓ Тест сдан (${bestScore}%)</div>` : ''}
              `}
            `;
            container.appendChild(card);

            if (!isLocked) {
              const form = document.getElementById(`testForm-${key}-${i}`);
              form.addEventListener('submit', async (e) => {
                e.preventDefault();
                let correctCount = 0;
                stage.questions.forEach((q, qi) => {
                  const selected = form.querySelector(`input[name="q-${key}-${i}-${qi}"]:checked`);
                  if (selected && parseInt(selected.value) === q.correct) correctCount++;
                });
                const score = Math.round((correctCount / stage.questions.length) * 100);
                const passResult = score >= stage.passScore;

                const resultEl = document.getElementById(`testResult-${key}-${i}`);
                resultEl.classList.remove('show', 'pass', 'fail');
                resultEl.classList.add('show', passResult ? 'pass' : 'fail');
                resultEl.textContent = passResult
                  ? `Отлично! Результат: ${score}%. Тест пройден.`
                  : `Результат: ${score}%. Нужно набрать минимум ${stage.passScore}%. Попробуйте ещё раз.`;

                userData.progress[key]['stage' + i] = { passed: passResult, score };
                await saveProgress();
                if (passResult) {
                  renderModuleStages(key);
                  renderOverview();
                }
              });
            }
            previousPassed = passed;
          }
        });
      }

      async function saveProgress() {
        try {
          await setDoc(doc(db, 'users', currentUser.email), userData, { merge: true });
        } catch (err) {
          console.error('Ошибка сохранения прогресса', err);
        }
      }
    </script>
  </body>
</html>
